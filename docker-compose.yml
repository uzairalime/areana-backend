services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: areana
      POSTGRES_PASSWORD: areana
      POSTGRES_DB: areana
      TZ: Asia/Karachi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Catches outgoing email in dev — open http://localhost:8025 to read OTPs
  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  pgdata:
